<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Page</title>

  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    a {
      display: inline-block;
      color: white;
      text-decoration: none;
      position: relative;
      transition: 0.3s ease;
    }

    a:hover {
      transform: translateY(-3px);
      text-shadow: 0 0 12px white;
    }

    a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: white;
      transform: translateX(-50%);
      transition: 0.3s ease;
    }

    a:hover::after {
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>My Page</h1>

  <p>
    <a href="www.instagram.com/deadrxkz?stkn=M3o5dTJ3dzN0bmx1">Instagram</a>
  </p>

</body>
</html>
